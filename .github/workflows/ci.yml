name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compose:
    name: Python, Compose, tests and SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned checking tools
        run: python -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Check prerequisites
        run: |
          docker compose version
          openssl version
      - name: Compile and lint Python
        run: |
          python -m compileall -q scripts src tests
          ruff check --select E9,F63,F7,F82 scripts src tests
      - name: Validate Compose configurations
        run: |
          docker compose --env-file lab/.env.example -f lab/compose.yaml config --quiet
          docker compose --env-file lab/.env.backup.example -f lab/compose.yaml -f lab/compose.backup.yaml config --quiet
          docker compose --env-file lab/.env.monitoring.example -f lab/compose.yaml -f lab/compose.monitoring.yaml config --quiet
          docker compose --env-file lab/.env.simulator.example -f lab/compose.yaml -f lab/compose.incident.yaml --profile incident config --quiet
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scan Python with Bandit
        run: bandit -r scripts src --severity-level medium --confidence-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the current tree
        run: '"$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner --ignore-gitleaks-allow .'
      - name: Scan newly introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0{40}$ ]]; then
            log_options="-1 $HEAD_SHA"
          else
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git cat-file -e "${BASE_SHA}^{commit}"
            log_options="${BASE_SHA}..${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts="$log_options" .
