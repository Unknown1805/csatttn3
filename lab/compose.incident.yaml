services:
  simulator:
    profiles: [incident]
    image: csatttn3/workstation:stage1
    pull_policy: never
    entrypoint: [python, /app/simulator.py]
    command: []
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 32
    networks: [incident_net]
    volumes:
      - type: bind
        source: "${LAB_SIM_DATA_DIR:?Prepare a separate synthetic simulator test directory}"
        target: /lab/data
        bind:
          create_host_path: false
      - type: bind
        source: ../src/simulator/simulator.py
        target: /app/simulator.py
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
